<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria Descriptiva — NSS S.A.</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#f0f2f5;min-height:100vh;padding:32px 16px 64px}
.app{max-width:680px;margin:0 auto}

/* Header */
.top-header{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.top-header .logos{display:flex;gap:10px;align-items:center}
.top-header img{height:36px;object-fit:contain;opacity:0.5;transition:opacity .2s}
.top-header img.active{opacity:1}
.top-header h1{font-size:20px;font-weight:600;color:#1a1a2e;line-height:1.2}
.top-header h1 small{display:block;font-size:12px;font-weight:400;color:#888;letter-spacing:.05em;text-transform:uppercase}

/* Empresa tabs */
.empresa-tabs{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#d0d4dc;border-radius:10px;padding:2px;margin-bottom:24px}
.empresa-tab{background:#fff;border:none;border-radius:8px;padding:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .15s;font-size:13px;font-weight:500;color:#888}
.empresa-tab img{height:28px;object-fit:contain;filter:grayscale(1) opacity(.5);transition:filter .2s}
.empresa-tab.active{background:#fff;color:#222;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.empresa-tab.active img{filter:none}
.empresa-tab.active-iplan{color:#c00}
.empresa-tab.active-telmex{color:#0071bc}

/* Card */
.card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.07)}
.card-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#aaa;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #f0f0f0;display:flex;align-items:center;gap:8px}
.card-title .num{width:20px;height:20px;border-radius:50%;background:#222;color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-title .num.red{background:#c00}
.card-title .num.blue{background:#0071bc}

label{display:block;font-size:12px;font-weight:500;color:#666;margin-bottom:5px;margin-top:14px}
label:first-of-type{margin-top:0}
input[type=text],textarea{width:100%;border:1.5px solid #e8e8e8;border-radius:7px;padding:9px 12px;font-size:14px;font-family:inherit;color:#222;transition:border-color .15s;outline:none;background:#fafafa}
input[type=text]:focus,textarea:focus{border-color:#222;background:#fff}
textarea{resize:vertical;min-height:75px;line-height:1.5}

/* Tipo obra */
.tipo-group{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.tipo-btn{border:1.5px solid #e8e8e8;background:#fafafa;border-radius:7px;padding:10px;cursor:pointer;text-align:center;font-size:13px;font-weight:500;color:#888;transition:all .15s}
.tipo-btn:hover{border-color:#bbb;color:#444}
.tipo-btn.sel-iplan{border-color:#c00;background:#fff5f5;color:#c00}
.tipo-btn.sel-telmex{border-color:#0071bc;background:#f0f7ff;color:#0071bc}

/* Croquis upload */
.croquis-zone{border:2px dashed #dde;border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:all .2s;background:#fafbff;position:relative;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.croquis-zone:hover{border-color:#aab;background:#f5f6ff}
.croquis-zone.has-img{border-style:solid;border-color:#888;padding:0;overflow:hidden}
.croquis-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.croquis-zone .paste-hint{font-size:11px;color:#aaa}
.croquis-zone .icon-up{font-size:28px}
.croquis-zone .label-up{font-size:13px;font-weight:500;color:#666}
#croquis-preview{width:100%;max-height:220px;object-fit:contain;display:none}
.croquis-actions{display:flex;gap:8px;margin-top:8px}
.btn-clear{font-size:11px;color:#e55;border:1px solid #e55;background:none;border-radius:5px;padding:4px 10px;cursor:pointer}

/* Cronograma preview */
.cron-preview{border-radius:8px;overflow:hidden;border:1px solid #eee;margin-top:8px}
.cron-preview img{width:100%;display:block}
.cron-label{font-size:11px;color:#888;margin-top:6px;text-align:center;font-style:italic}

/* Generar */
.btn-gen{width:100%;padding:16px;font-size:15px;font-weight:600;font-family:inherit;border:none;border-radius:10px;cursor:pointer;transition:all .2s;color:#fff;background:#222;letter-spacing:.03em}
.btn-gen:hover{opacity:.85;transform:translateY(-1px)}
.btn-gen:active{transform:none}
.btn-gen:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-gen.iplan{background:#c00}
.btn-gen.telmex{background:#0071bc}

.status{text-align:center;font-size:13px;color:#aaa;margin-top:12px;min-height:18px}
.status.ok{color:#2e9e4f}
.status.err{color:#e53}
</style>
</head>

// ── Estado ──────────────────────────────────────────────────────
let empresa = 'iplan';
let tipo    = 'vereda';
let croquis = { b64: null, type: null };

// ── UI ──────────────────────────────────────────────────────────
function setEmpresa(e) {
  empresa = e;
  document.getElementById('tab-iplan').className  = 'empresa-tab' + (e==='iplan'  ? ' active active-iplan'  : '');
  document.getElementById('tab-telmex').className = 'empresa-tab' + (e==='telmex' ? ' active active-telmex' : '');
  document.getElementById('hdr-iplan').style.display  = e==='iplan'  ? '' : 'none';
  document.getElementById('hdr-telmex').style.display = e==='telmex' ? '' : 'none';
  const btn = document.getElementById('btn-gen');
  btn.className = 'btn-gen ' + e;
  btn.textContent = '⬇ Generar PDF — ' + e.toUpperCase();
  // update num colors
  ['num1','num2','num3','num4'].forEach(id => {
    document.getElementById(id).className = 'num ' + (e === 'iplan' ? 'red' : 'blue');
  });
  // update tipo selected class
  refreshTipoStyles();
}

function setTipo(el) {
  tipo = el.dataset.val;
  refreshTipoStyles();
  // update cronograma
  document.getElementById('cron-img').src = 'data:image/jpeg;base64,' + CRON[tipo].b64;
  document.getElementById('cron-label').textContent = 'Cronograma ' + CRON[tipo].label;
}

function refreshTipoStyles() {
  const cls = empresa === 'iplan' ? 'sel-iplan' : 'sel-telmex';
  ['tipo-vereda','tipo-calzada'].forEach(id => {
    const el = document.getElementById(id);
    el.className = 'tipo-btn' + (el.dataset.val === tipo ? ' ' + cls : '');
  });
}

function handleCroquis(evt) {
  const file = evt.target.files[0];
  if (!file) return;
  loadCroquisFile(file, file.name);
}

function loadCroquisFile(file, name) {
  const reader = new FileReader();
  reader.onload = e => {
    const dataUrl = e.target.result;
    croquis.b64  = dataUrl.split(',')[1];
    croquis.type = file.type.includes('png') ? 'PNG' : 'JPEG';
    showCroquis(dataUrl, name || 'imagen');
  };
  reader.readAsDataURL(file);
}

function showCroquis(dataUrl, name) {
  const zone = document.getElementById('croquis-zone');
  const prev = document.getElementById('croquis-preview');
  const ph   = document.getElementById('croquis-placeholder');
  prev.src = dataUrl;
  prev.style.display = 'block';
  ph.style.display = 'none';
  zone.classList.add('has-img');
  document.getElementById('croquis-actions').style.display = 'flex';
  document.getElementById('croquis-fname').textContent = name;
}

function clearCroquis() {
  croquis = { b64: null, type: null };
  const prev = document.getElementById('croquis-preview');
  prev.style.display = 'none';
  prev.src = '';
  document.getElementById('croquis-placeholder').style.display = '';
  document.getElementById('croquis-zone').classList.remove('has-img');
  document.getElementById('croquis-actions').style.display = 'none';
  document.getElementById('croquis-input').value = '';
}

// Ctrl+V paste
document.addEventListener('paste', e => {
  const items = e.clipboardData.items;
  for (const item of items) {
    if (item.type.startsWith('image/')) {
      const file = item.getAsFile();
      loadCroquisFile(file, 'captura.png');
      break;
    }
  }
});

// ── PDF ─────────────────────────────────────────────────────────
const ACCENT = { iplan: [180, 0, 0], telmex: [0, 113, 188] };

function addPageFrame(doc, empresa, pageNum) {
  const W = 210, H = 297;
  const logo = LOGOS[empresa];

  // Logo lateral izquierdo (como en el original — rotado)
  // El logo IPLAN original está vertical. Lo ponemos en la esquina sup izq pequeño
  if (empresa === 'iplan') {
    doc.addImage(logo.b64, 'JPEG', 8, 6, 9, 22);
  } else {
    doc.addImage(logo.b64, 'PNG', 7, 8, 22, 14);
  }

  // Línea separadora header
  doc.setDrawColor(200, 200, 200);
  doc.setLineWidth(0.3);
  doc.line(22, 32, W - 15, 32);

  // Firma abajo izq — cada página
  doc.addImage(FIRMA_B64, 'JPEG', 10, H - 38, 26, 20);
  doc.setFontSize(6.5);
  doc.setFont('helvetica', 'normal');
  doc.setTextColor(60, 60, 60);
  const repTecnico = document.getElementById('rep-tecnico').value.trim() || 'Ing. Pablo Aguirre Paz';
  const matricula  = document.getElementById('matricula').value.trim() || 'MAT. PROF. N° 15335 – CPIC';
  const empresa_c  = document.getElementById('empresa-contratista').value.trim() || 'NSS S.A.';
  doc.text(repTecnico, 10, H - 16.5);
  doc.text('Representante Técnico', 10, H - 13.5);
  doc.text(empresa_c, 10, H - 10.5);
  doc.text(matricula, 10, H - 7.5);

  // Número de página dcha
  doc.setFontSize(8);
  doc.setTextColor(150, 150, 150);
  doc.text(String(pageNum), W - 14, H - 8, { align: 'right' });
}

async function generarPDF() {
  const direccion = document.getElementById('direccion').value.trim();
  if (!direccion) { showStatus('Ingresá la dirección de la obra.', 'err'); return; }

  const btn = document.getElementById('btn-gen');
  btn.disabled = true;
  showStatus('Generando...', '');

  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });

    const W = 210, H = 297;
    const ML = 22, MR = 15, MT = 38;   // margins (left leaves room for logo)
    const CW = W - ML - MR;             // 173mm content width
    let pg = 1;

    // ══════════════════════════════
    // PÁGINA 1 — Portada
    // ══════════════════════════════
    addPageFrame(doc, empresa, pg);

    // Título centrado grande
    let y = MT + 20;
    doc.setFontSize(22);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(20, 20, 20);
    // Underline trick: draw line under text
    const titleText = 'MEMORIA DESCRIPTIVA';
    const titleW = doc.getTextWidth(titleText);
    doc.text(titleText, W / 2, y, { align: 'center' });
    doc.setLineWidth(0.6);
    doc.setDrawColor(...ACCENT[empresa]);
    doc.line(W / 2 - titleW / 2, y + 1.5, W / 2 + titleW / 2, y + 1.5);

    y += 30;
    doc.setFontSize(14);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(30, 30, 30);
    doc.text('OBRA EN ' + direccion.toUpperCase(), W / 2, y, { align: 'center' });

    y += 16;
    doc.setFontSize(13);
    doc.setFont('helvetica', 'bold');
    doc.text('CANALIZACION, E INSTALACION DE CAÑERIAS', W / 2, y, { align: 'center' });

    // ══════════════════════════════
    // PÁGINA 2 — Índice
    // ══════════════════════════════
    doc.addPage(); pg++;
    addPageFrame(doc, empresa, pg);
    y = MT;

    doc.setFontSize(13);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(30, 30, 30);
    doc.text('INDICE', W / 2, y, { align: 'center' });
    y += 12;

    // dot leaders
    const idx = [
      ['RESUMEN', '3'],
      ['    Plan de trabajo', '4'],
      ['    Programa e ingreso de trabajo', '5'],
      ['    Zona de trabajo', '5'],
      ['    Horario de trabajo', '5'],
      ['OBRA CIVIL', '5'],
      ['    Relevamiento y replanteo de sitio', '5'],
      ['    Cierre perimetral y señalización', '6'],
      ['SEGURIDAD Y SEÑALIZACION', '7'],
      ['FINALIZACION DE OBRA', '7'],
      ['    Limpieza, Desmovilización, CAOS y documentación final', '7'],
    ];
    doc.setFontSize(10);
    idx.forEach(([txt, pag]) => {
      const isBold = !txt.startsWith(' ');
      doc.setFont('helvetica', isBold ? 'bold' : 'normal');
      doc.setTextColor(30, 30, 30);
      doc.text(txt.trim(), ML + (txt.startsWith(' ') ? 8 : 0), y);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(120, 120, 120);
      // dots
      const txtW = doc.getTextWidth(txt.trim()) + ML + (txt.startsWith(' ') ? 8 : 0);
      const pgW  = doc.getTextWidth(pag);
      const dotX1 = txtW + 2;
      const dotX2 = W - MR - pgW - 2;
      if (dotX2 > dotX1) {
        const dots = '.'.repeat(Math.floor((dotX2 - dotX1) / doc.getTextWidth('.')));
        doc.text(dots, dotX1, y);
      }
      doc.setTextColor(30, 30, 30);
      doc.text(pag, W - MR, y, { align: 'right' });
      y += 7;
    });

    // ══════════════════════════════
    // PÁGINA 3 — Resumen + Croquis
    // ══════════════════════════════
    doc.addPage(); pg++;
    addPageFrame(doc, empresa, pg);
    y = MT;

    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(30, 30, 30);
    doc.text('RESUMEN', ML, y);
    y += 9;

    const descripcion = document.getElementById('descripcion').value.trim();
    const resumenFull = 'El trabajo a realizar corresponde a una ' + descripcion;
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(10.5);
    doc.setTextColor(40, 40, 40);
    const resLines = doc.splitTextToSize(resumenFull, CW);
    doc.text(resLines, ML, y);
    y += resLines.length * 6 + 10;

    // Croquis
    if (croquis.b64) {
      // Calcular altura proporcional max 90mm
      const img = new Image();
      img.src = 'data:image/' + (croquis.type === 'PNG' ? 'png' : 'jpeg') + ';base64,' + croquis.b64;
      await new Promise(r => { img.onload = r; img.onerror = r; });
      const ratio = img.naturalHeight / (img.naturalWidth || 1);
      const imgW = CW;
      let imgH = imgW * ratio;
      if (imgH > 100) imgH = 100;
      // Page break if needed
      if (y + imgH + 20 > H - 45) { doc.addPage(); pg++; addPageFrame(doc, empresa, pg); y = MT; }
      doc.addImage(croquis.b64, croquis.type, ML, y, imgW, imgH);
      y += imgH + 4;
      doc.setFontSize(9);
      doc.setFont('helvetica', 'italic');
      doc.setTextColor(80, 80, 80);
      const tipoLabel = tipo === 'vereda'
        ? 'Esquema de obra. Construcción de Cañería para colocación de Fibra Óptica'
        : 'Esquema de obra. Reparación de Cámara para colocación de Fibra Óptica';
      doc.text(tipoLabel, W / 2, y, { align: 'center' });
      y += 10;
    }

    // ══════════════════════════════
    // PÁGINA 4 — Plan de trabajo + Cronograma
    // ══════════════════════════════
    doc.addPage(); pg++;
    addPageFrame(doc, empresa, pg);
    y = MT;

    // Plan de trabajo — underline
    doc.setFontSize(11);
    doc.setFont('helvetica', 'normal');
    doc.setTextColor(30, 30, 30);
    const planTitle = 'Plan de trabajo';
    doc.text(planTitle, ML, y);
    doc.setLineWidth(0.3);
    doc.setDrawColor(60, 60, 60);
    doc.line(ML, y + 1, ML + doc.getTextWidth(planTitle), y + 1);
    y += 9;

    doc.setFontSize(10.5);
    const planTxt = 'El tiempo estimado de la obra será de un total de 8 días corridos correspondiente a canalización e instalación de ductos, sin incluir el tiempo de gestión de permisos que dependerá de cada ente responsable. A continuación, se muestra el programa por sitio de obra:';
    const planLines = doc.splitTextToSize(planTxt, CW);
    doc.setTextColor(40, 40, 40);
    doc.text(planLines, ML, y);
    y += planLines.length * 6 + 10;

    // Cronograma embebido
    const cron = CRON[tipo];
    const cronImg = new Image();
    cronImg.src = 'data:image/jpeg;base64,' + cron.b64;
    await new Promise(r => { cronImg.onload = r; cronImg.onerror = r; });
    const cronRatio = cronImg.naturalHeight / (cronImg.naturalWidth || 1);
    const cronW = CW;
    const cronH = Math.min(cronW * cronRatio, 70);
    if (y + cronH + 15 > H - 45) { doc.addPage(); pg++; addPageFrame(doc, empresa, pg); y = MT; }
    doc.addImage(cron.b64, 'JPEG', ML, y, cronW, cronH);
    y += cronH + 4;
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(60, 60, 60);
    doc.text('Imagen 3. Tiempos de actividades', W / 2, y, { align: 'center' });
    y += 12;

    // Programa e ingreso
    const secciones = [
      ['Programa e ingreso de trabajo', 'La programación de actividades se enviará al personal de Inspección de Obra para la confirmación del inicio de trabajos correspondientes.'],
      ['Zona de trabajo', 'El área de trabajo será en las inmediaciones de los sitios ya mostrados sin producirse alguna intervención del paso de peatones o vehículos la cual pueda obstaculizar o impedir su circulación. En caso de que se requiera la ocupación le será comunicado a la Inspección de Obra con anticipación para su autorización.'],
      ['Horario de trabajo', 'El horario de actividades será de 8:00 a 18:00 horas con 9 horas de trabajo. Se dará aviso al personal responsable el inicio y el final de las actividades.'],
    ];

    for (const [title, body] of secciones) {
      if (y > H - 60) { doc.addPage(); pg++; addPageFrame(doc, empresa, pg); y = MT; }
      doc.setFontSize(11);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(30, 30, 30);
      doc.text(title, ML, y);
      doc.setLineWidth(0.3);
      doc.setDrawColor(60, 60, 60);
      doc.line(ML, y + 1, ML + doc.getTextWidth(title), y + 1);
      y += 8;
      doc.setFontSize(10.5);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(40, 40, 40);
      const blines = doc.splitTextToSize(body, CW);
      doc.text(blines, ML, y);
      y += blines.length * 6 + 8;
    }

    // ══════════════════════════════
    // PÁGINA 5 — Obra Civil
    // ══════════════════════════════
    doc.addPage(); pg++;
    addPageFrame(doc, empresa, pg);
    y = MT;

    doc.setFontSize(12);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(30, 30, 30);
    doc.text('OBRA CIVIL', ML, y);
    y += 10;

    const civilSecs = [
      ['Relevamiento y replanteo de sitio', 'Se realizarán las actividades de relevamiento y replanteo de las áreas a afectadas por los trabajos, realizando sondeos para determinar la existencia de posibles interferencias con otros servicios, definiendo así la traza a ejecutar evitando cualquier tipo de daños.'],
      ['Cierre perimetral y señalización', 'El sistema de seguridad se ajustará de acuerdo al ente responsable que involucre el proyecto, ya sea municipal, ferroviario o de vialidad, cumpliendo con todas las normas y exigencias de seguridad y señalización. Antes de comenzar las tareas de canalización, se realizará el cierre perimetral (Vallas, Cajones, malla de seguridad, cinta de señalamiento, conos, entre otros) y la señalización correspondiente de los sitios a intervenir. Los mismos serán supervisados por nuestro personal técnico y de seguridad e higiene realizando controles y seguimientos diariamente. En todos los casos se mantendrá en contacto con las autoridades oficiales a fin de adecuarse o comunicarles sobre las medidas de prevención y tipo de señalización a efectuar'],
    ];

    for (const [title, body] of civilSecs) {
      if (y > H - 60) { doc.addPage(); pg++; addPageFrame(doc, empresa, pg); y = MT; }
      doc.setFontSize(11);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(30, 30, 30);
      doc.text(title, ML, y);
      doc.setLineWidth(0.3);
      doc.setDrawColor(60, 60, 60);
      doc.line(ML, y + 1, ML + doc.getTextWidth(title), y + 1);
      y += 8;
      doc.setFontSize(10.5);
      doc.setFont('helvetica', 'normal');
      doc.setTextColor(40, 40, 40);
      const blines = doc.splitTextToSize(body, CW);
      doc.text(blines, ML, y);
      y += blines.length * 6 + 10;
    }

    // Imagen cierre perimetral placeholder (imagen fija del original)
    // Solo box indicativo — no tenemos la foto de obra
    if (y + 45 > H - 45) { doc.addPage(); pg++; addPageFrame(doc, empresa, pg); y = MT; }
    doc.setDrawColor(200, 200, 200);
    doc.setFillColor(248, 248, 248);
    doc.roundedRect(ML, y, CW, 38, 2, 2, 'FD');
    doc.setFontSize(8.5);
    doc.setFont('helvetica', 'italic');
    doc.setTextColor(160, 160, 160);
    doc.text('[ Foto Cierre Perimetral ]', W / 2, y + 19, { align: 'center' });
    y += 42;
    doc.setFontSize(9);
    doc.setFont('helvetica', 'bold');
    doc.setTextColor(60, 60, 60);
    doc.text('Imagen 5. Cierre Perimetral.', W / 2, y, { align: 'center' });
    y += 12;

    // ══════════════════════════════
    // Seguridad y Finalización
    // ══════════════════════════════
    const finalSecs = [
      ['SEGURIDAD Y SEÑALIZACION', true, 'La obra estará respectivamente vallada permitiendo el tránsito en la zona de trabajo.\nSe destaca que en las actividades de obra civil el sistema de seguridad se ajustará a la Ordenanza Municipal vigente, cumpliendo con los principios básicos de seguridad y señalización. En todos los casos se mantendrá en contacto con las autoridades oficiales o entes encargados a fin de adecuarse o comunicarles sobre las medidas de prevención y tipo de señalización a efectuar. Se utilizarán los elementos necesarios para la señalización y seguridad de los frentes de trabajos como vallas, cartelería, cintas de prevención, balizas, etc.'],
      ['FINALIZACION DE OBRA', true, null],
      ['Limpieza, Desmovilización, CAOS y documentación final', false, 'Para finalizar, se realizará un recorrido de la obra como parte de limpieza, además se ejecutará la desmovilización de los equipos, herramientas y materiales sobrantes del sitio, la cual serán transportados hasta el obrador de la empresa.\n\nEn conjunto se cerrará la obra con la documentación final y los CAOS especificando los trabajos ejecutados de obra civil, y de tendido de mangueras por parte de nuestra oficina técnica.'],
    ];

    for (const [title, isBig, body] of finalSecs) {
      if (y > H - 55) { doc.addPage(); pg++; addPageFrame(doc, empresa, pg); y = MT; }
      doc.setFontSize(isBig ? 12 : 11);
      doc.setFont('helvetica', isBig ? 'bold' : 'normal');
      doc.setTextColor(30, 30, 30);
      doc.text(title, ML, y);
      if (!isBig) {
        doc.setLineWidth(0.3);
        doc.setDrawColor(60, 60, 60);
        doc.line(ML, y + 1, ML + doc.getTextWidth(title), y + 1);
      }
      y += isBig ? 9 : 8;

      if (body) {
        doc.setFontSize(10.5);
        doc.setFont('helvetica', 'normal');
        doc.setTextColor(40, 40, 40);
        // Handle \n as paragraph breaks
        const paras = body.split('\n').filter(p => p.trim());
        for (const para of paras) {
          const blines = doc.splitTextToSize(para, CW);
          if (y + blines.length * 6 > H - 45) { doc.addPage(); pg++; addPageFrame(doc, empresa, pg); y = MT; }
          doc.text(blines, ML, y);
          y += blines.length * 6 + 5;
        }
        y += 4;
      }
    }

    // ── Guardar ──
    const safeDir = direccion.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ]/g, '_').substring(0, 40).trim();
    doc.save('Memoria_Descriptiva_' + LOGOS[empresa].type.charAt(0) + '_' + empresa.toUpperCase() + '_' + safeDir + '.pdf');
    showStatus('✓ PDF generado correctamente', 'ok');

  } catch (err) {
    console.error(err);
    showStatus('Error: ' + err.message, 'err');
  }
  btn.disabled = false;
}

function showStatus(msg, cls) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status ' + cls;
}
</script>
</body>
</html>
